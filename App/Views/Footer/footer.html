<div class="footer-container scale-ui">
    <div class="footer-content">
        <div class="footer-car-preview">
            <div class="preview-placeholder" data-type="car">
                <svg viewBox="0 0 64 64" class="dark">
                    <use xlink:href="#icon-car" x="0" y="0" width="64" height="64"></use>
                </svg>
                <span>Select a car</span>
            </div>
        </div>
        <div class="footer-track-preview">
            <div class="preview-placeholder" data-type="track">
                <svg viewBox="0 0 64 64" class="dark">
                    <use xlink:href="#icon-track" x="0" y="0" width="64" height="64"></use>
                </svg>
                <span>Select a track</span>
            </div>
        </div>
        <div class="footer-session-info">
            <div class="session-text">
                <span class="no-selection">Select a car and track to play</span>
            </div>
        </div>
        <div class="footer-play-button">
            <button class="play-btn" disabled>
                <svg viewBox="0 0 64 64" class="dark">
                    <use xlink:href="#icon-play" x="0" y="0" width="64" height="64"></use>
                </svg>
                <span>Start Race</span>
            </button>
        </div>
    </div>
</div>
