<div class="track" data-id="{{id}}" data-path="{{path}}" style="background-image: url('{{preview}}');">
    <img class="track-outline" src="{{outline}}" onerror="this.style.display='none'" alt="" />
    <div class="info">
        <div class="flag">
            <img src="/images/flags/80x60/{{country}}.png" alt="{{countryName}}" title="{{countryName}}" />
        </div>
        <span class="track-name">{{name}}</span><span class="city">{{city}}</span>
    </div>
</div>
