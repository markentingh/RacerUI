<div class="car" data-path="{{path}}">
    {{has-rating}}<rating-stars class="rating-badge" rating="{{rating}}" filled-only readonly></rating-stars>{{/has-rating}}
    <img class="preview" src="{{preview}}"/>
    <div class="info">
        <div class="flag">
            <img src="/images/flags/80x60/{{countryCode}}.png" alt="{{country}} flag" />
        </div>
        <h2>{{name}}</h2>
    </div>
</div>
