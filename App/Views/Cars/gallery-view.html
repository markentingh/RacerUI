<div class="gallery-view scale-ui">
    <div class="gallery-selected">
        <img class="preview" src="{{preview}}"/>
        <div class="info">
            <h2>{{name}}</h2>
        </div>
    </div>
    <div class="gallery-footer">
        <div class="gallery-target"></div>
        <div class="gallery-items">
            <div class="gallery-scroller">
                {{items}}
            </div>
        </div>
    </div>
</div>
